name: 🖥️ Build Admin Panel CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'admin_panel/**'
      - '.github/workflows/admin-panel-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'admin_panel/**'

jobs:
  build-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin_panel
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'admin_panel/package-lock.json'

      - name: 📦 Install dependencies (clean)
        run: npm ci

      - name: 🏗️ Build Admin Panel
        run: npm run build
        env:
          VITE_API_URL: https://al-markazia.duckdns.org/api/v1
