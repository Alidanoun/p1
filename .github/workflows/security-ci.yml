# .github/workflows/security-ci.yml
# وصف: خط أنابيب أمني تلقائي لمشروع AL-MARKAZIA
# يُنفّذ عند: كل push/PR على الفروع الرئيسية مع تغييرات في backend

name: 🔐 AL-MARKAZIA Security CI

on:
  push:
    branches: [ main, develop, 'feat/**' ]
    paths:
      - 'al_markazia_backend/**'
      - 'package-lock.json'
      - '.github/workflows/security-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'al_markazia_backend/**'
      - 'package-lock.json'
  schedule:
    # فحص أمني أسبوعي تلقائي حتى بدون تغييرات
    - cron: '0 2 * * 1'  # كل اثنين الساعة 2 صباحاً بالتوقيت العالمي

# منع تشغيل متوازي لنفس الـ workflow على نفس الفرع
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # المرحلة 1: الفحص السريع (يُنفّذ أولاً لإيقاف المشاكل المبكرة)
  # ─────────────────────────────────────────────────────────────
  quick-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./al_markazia_backend
    timeout-minutes: 5
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # لجلب آخر 2 commit للمقارنة

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'al_markazia_backend/package-lock.json'

      - name: 📦 Install dependencies (clean)
        run: npm ci --ignore-scripts --no-audit

      - name: 🎨 Lint & Format Check
        run: |
          npm run lint --if-present || echo "⚠️  No lint script found, skipping"
          npm run format:check --if-present || echo "⚠️  No format check script found, skipping"

      - name: 🔍 Quick NPM Audit
        run: npm audit --audit-level=high --json > ../audit-report.json || true

      - name: 📊 Upload audit report (if any)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: audit-report.json
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # المرحلة 2: الفحص الأمني المتقدم والاختبارات
  # ─────────────────────────────────────────────────────────────
  security-and-tests:
    runs-on: ubuntu-latest
    needs: quick-checks
    defaults:
      run:
        working-directory: ./al_markazia_backend
    timeout-minutes: 15
    
    services:
      # قاعدة بيانات PostgreSQL للاختبارات
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: markazia_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      # Redis للاختبارات (إذا كان المشروع يستخدمه)
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'al_markazia_backend/package-lock.json'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🗄️ Run Prisma Migrations (for test DB)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/markazia_test?schema=public

      - name: 🔐 Run Semgrep Security Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/nodejs
            p/owasp-top-ten
          # استبعاد ملفات الاختبار والتوليد التلقائي
          exclude: "tests/,node_modules/,prisma/generated/"
          # إيقاف الـ workflow إذا وُجدت ثغرات حرجة
          auditOn: push

      - name: 🧪 Run Unit & Integration Tests
        run: npm test -- --coverage --coverageReporters=json --coverageReporters=text
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/markazia_test?schema=public
          REDIS_URL: redis://localhost:6379/1
          JWT_SECRET: test_secret_for_ci_only
          SENTRY_DSN: ''  # تعطيل Sentry في الاختبارات

      - name: 🏗️ Build Production Bundle
        run: npm run build --if-present

      - name: 🧹 Clean up test artifacts
        if: always()
        run: rm -rf node_modules/.cache coverage dist

  # ─────────────────────────────────────────────────────────────
  # المرحلة 3: التقرير النهائي والإشعارات
  # ─────────────────────────────────────────────────────────────
  report:
    runs-on: ubuntu-latest
    needs: [quick-checks, security-and-tests]
    if: always()  # يُنفّذ دائماً لعرض النتيجة النهائية
    
    steps:
      - name: 📋 Generate Summary
        run: |
          echo "## 🔐 AL-MARKAZIA Security CI Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| المرحلة | الحالة | المدة |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| الفحص السريع | ${{ needs.quick-checks.result }} | ~5 دقائق |" >> $GITHUB_STEP_SUMMARY
          echo "| الفحص الأمني والاختبارات | ${{ needs.security-and-tests.result }} | ~15 دقيقة |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.security-and-tests.result }}" == "success" ]]; then
            echo "✅ **جميع الفحوصات الأمنية ناجحة** - الكود جاهز للمراجعة" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **تم اكتشاف مشاكل** - راجع السجلات أعلاه" >> $GITHUB_STEP_SUMMARY
          fi
