# ── Redis Production Configuration ───────────────────────────
# ACL-based authentication for production deployment
# Image: redis:7-alpine
# Passwords are injected via environment variables at runtime

# ── Persistence ─────────────────────────────────────────────
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# ── Security ────────────────────────────────────────────────
bind 0.0.0.0
protected-mode yes

# Disable default user — overridden by docker-compose environment password
# user default off

# app_main — Full access for the main application
# Password injected dynamically via docker command
# app_worker — All commands but restricted key patterns
# Password injected dynamically via docker command

# ── Performance ─────────────────────────────────────────────
maxmemory 512mb
maxmemory-policy noeviction
timeout 300
tcp-keepalive 60

# ── Hardening ───────────────────────────────────────────────
# Disable dangerous commands
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
rename-command CONFIG "CONFIG_b8f4a2c1"

# ── Slow Log ────────────────────────────────────────────────
slowlog-log-slower-than 10000
slowlog-max-len 128

# End of Configuration (ensure trailing newlines exist below)

