# ── Redis Production Configuration ───────────────────────────
# ACL-based authentication for production deployment
# Image: redis:7-alpine
# Passwords are injected via environment variables at runtime

# ── Persistence ─────────────────────────────────────────────
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# ── Security ────────────────────────────────────────────────
bind 0.0.0.0
protected-mode yes

# Disable default user — prevents unauthenticated access
user default off

# app_main — Full access for the main application
# Password injected via REDIS_PASSWORD env var
user app_main on >${REDIS_PASSWORD} ~* &* +@all

# app_worker — All commands but restricted key patterns
# Password injected via REDIS_WORKER_PASSWORD env var
user app_worker on >${REDIS_WORKER_PASSWORD} ~bull:* ~stream:* ~idempotency:* ~cache:* ~audit:* ~health:* &* +@all

# ── Performance ─────────────────────────────────────────────
maxmemory 512mb
maxmemory-policy allkeys-lru
timeout 300
tcp-keepalive 60

# ── Hardening ───────────────────────────────────────────────
# Disable dangerous commands
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
rename-command CONFIG "CONFIG_b8f4a2c1"

# ── Slow Log ────────────────────────────────────────────────
slowlog-log-slower-than 10000
slowlog-max-len 128
