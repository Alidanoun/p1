services:
  db:
    image: postgres:17-alpine
    container_name: al-markazia-db
    restart: always
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_32chars_minimum}
      POSTGRES_DB: al_markazia_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: al-markazia-redis
    restart: always
    command: ["redis-server", "/usr/local/etc/redis/redis-dev.conf"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis-dev.conf:/usr/local/etc/redis/redis-dev.conf:ro

volumes:
  postgres_data:
  redis_data:
