# ── Redis Development Configuration ──────────────────────────
# ACL-based authentication for local development
# Image: redis:7-alpine

# ── Persistence ─────────────────────────────────────────────
appendonly yes
appendfilename "appendonly.aof"

# ── Security ────────────────────────────────────────────────
bind 0.0.0.0
protected-mode no

# ── ACL Users ───────────────────────────────────────────────

# Disable default user — prevents unauthenticated access
user default off

# app_main — Full access for the main application
# Used by: redis.js, cacheService.js, auditService.js, healthCheck.js
user app_main on >MOBoCyCEKMWaaJzLIFqgixSvjTXsqxM9a3DKOIMDLT68A ~* &* +@all

# app_worker — All commands but restricted key patterns
# Used by: BullMQ queues (orderQueue, emailQueue, moderationQueue, healthWorker)
# Key patterns: bull:*, stream:*, idempotency:*, cache:*, audit:*
user app_worker on >u6B7ToD2uGEgZ0jjvNoCs4hGltBsNMclOyTlvghUEqgQGb ~bull:* ~stream:* ~idempotency:* ~cache:* ~audit:* ~health:* &* +@all

# ── Performance ─────────────────────────────────────────────
maxmemory 256mb
maxmemory-policy allkeys-lru
timeout 300
tcp-keepalive 60
