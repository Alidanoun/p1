version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: al-markazia-prod-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-production_secure_db_password_32_chars_long}
      POSTGRES_DB: ${POSTGRES_DB:-al_markazia_prod_db}
    command: 
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=64MB"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - al_markazia_prod_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-al_markazia_prod_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: al-markazia-prod-redis
    restart: always
    command: /bin/sh -c "cp /usr/local/etc/redis/redis-prod.conf /tmp/redis.conf && echo \"user app_main on >$$REDIS_PASSWORD ~* &* +@all\" >> /tmp/redis.conf && echo \"user app_worker on >$$REDIS_WORKER_PASSWORD ~bull:* ~stream:* ~idempotency:* ~cache:* ~audit:* ~health:* &* +@all\" >> /tmp/redis.conf && redis-server /tmp/redis.conf"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_WORKER_PASSWORD=${REDIS_WORKER_PASSWORD}
    volumes:
      - redis_prod_data:/data
      - ./redis-prod.conf:/usr/local/etc/redis/redis-prod.conf:ro
    networks:
      - al_markazia_prod_network
    healthcheck:
      test: ["CMD", "redis-cli", "--user", "app_main", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: al-markazia-prod-app
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      - app_prod_logs:/usr/src/app/logs
      - app_prod_uploads:/usr/src/app/uploads
      - ./.env.production:/usr/src/app/.env.production:ro
      - ./.env.keys:/usr/src/app/.env.keys:ro
    networks:
      - al_markazia_prod_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:5000/health/external || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.25-alpine
    container_name: al-markazia-prod-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - app_prod_uploads:/usr/src/app/uploads:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ../admin_panel/dist:/usr/share/nginx/html/admin_panel:ro
    networks:
      - al_markazia_prod_network
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  al_markazia_prod_network:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  app_prod_logs:
  app_prod_uploads:
