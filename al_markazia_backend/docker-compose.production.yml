version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: al-markazia-prod-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-production_secure_db_password_32_chars_long}
      POSTGRES_DB: ${POSTGRES_DB:-al_markazia_prod_db}
    command: 
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=64MB"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - al_markazia_prod_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-al_markazia_prod_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: al-markazia-prod-redis
    restart: always
    command: ["redis-server", "/usr/local/etc/redis/redis-prod.conf"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_WORKER_PASSWORD=${REDIS_WORKER_PASSWORD}
    volumes:
      - redis_prod_data:/data
      - ./redis-prod.conf:/usr/local/etc/redis/redis-prod.conf:ro
    networks:
      - al_markazia_prod_network
    healthcheck:
      test: ["CMD", "redis-cli", "--user", "app_main", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: al-markazia-prod-app
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-production_secure_db_password_32_chars_long}@db:5432/${POSTGRES_DB:-al_markazia_prod_db}?schema=public
      - REDIS_URL=redis://${REDIS_USERNAME:-app_main}:${REDIS_PASSWORD:-redis_production_secure_password_32_chars}@redis:6379
      - REDIS_USERNAME=${REDIS_USERNAME:-app_main}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_production_secure_password_32_chars}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_WORKER_USERNAME=${REDIS_WORKER_USERNAME:-app_worker}
      - REDIS_WORKER_PASSWORD=${REDIS_WORKER_PASSWORD:-redis_production_secure_worker_password_32_chars}
      - JWT_SECRET=${JWT_SECRET:-production_jwt_secret_key_32_chars_long_long}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:-production_refresh_secret_key_32_chars_long}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-production_encryption_key_32_chars_long_long}
      - SENTRY_DSN=${SENTRY_DSN}
      - TIMEZONE=Asia/Amman
    volumes:
      - app_prod_logs:/usr/src/app/logs
      - app_prod_uploads:/usr/src/app/uploads
    networks:
      - al_markazia_prod_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:5000/health/external || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.25-alpine
    container_name: al-markazia-prod-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - app_prod_uploads:/usr/src/app/uploads:ro
      - nginx_certs:/etc/nginx/certs:ro
    networks:
      - al_markazia_prod_network
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  al_markazia_prod_network:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  app_prod_logs:
  app_prod_uploads:
  nginx_certs:
