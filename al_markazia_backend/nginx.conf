user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─── Log Formats & Engine Toggles ──────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" [$request_time]';

    access_log /var/log/nginx/access.log main buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # ─── Rate Limiting Allocations ─────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # ─── Gzip Compression Tuning ───────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types application/json application/javascript text/xml text/css text/plain application/xml+rss;

    # ─── Upstream Connection Pools ─────────────────────────────────────────────
    upstream backend_app {
        server app:5000;
        # Preserve active background connection threads to optimize connection speeds
        keepalive 32;
    }

    # ─── HTTP -> HTTPS Ingress Redirector ──────────────────────────────────────
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        
        # Intercept health probe specifically to clear container validation sequences
        location /health {
            default_type application/json;
            return 200 '{"status":"healthy","service":"nginx-edge"}';
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── Secure HTTPS Edge Proxy Block ─────────────────────────────────────────
    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name _;

        # Explicitly mount ephemeral container mapped TLS components
        ssl_certificate /etc/letsencrypt/live/al-markazia.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/al-markazia.duckdns.org/privkey.pem;

        # TLS Protocols: Restrict usage explicitly to safe v1.2 and v1.3 profiles
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Standard Enterprise Security Policy Enforcement Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Admin Panel Static Files Root
        root /usr/share/nginx/html/admin_panel;
        index index.html;

        # Common proxy directives
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ─── 1. Canonical API Routing (/api/) ──────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://backend_app/api/;
            proxy_set_header Connection ""; # Required for upstream keepalive compatibility
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # ─── 2. Dedicated Auth Routing Pipeline (/api/auth) ────────────────────
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://backend_app/api/auth/;
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
        }

        # ─── 3. Realtime WebSockets Transport Pipeline (/socket.io) ────────────
        location /socket.io/ {
            proxy_pass http://backend_app/socket.io/;
            # Preserve state protocol upgrades required by persistent client pools
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_read_timeout 3600s; # Prolong keepalive timeout windows for persistent socket handshakes
            proxy_send_timeout 3600s;
        }

        # ─── Static Uploads Exposer ────────────────────────────────────────────
        location /uploads/ {
            alias /usr/src/app/uploads/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        # ─── Admin Panel UI Frontend SPA Routing ───────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ─── Dashboard Subdomain Server Block (Redirect to Unified Domain) ─────────
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name al-markazia-admin.duckdns.org;
        
        ssl_certificate /etc/letsencrypt/live/al-markazia.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/al-markazia.duckdns.org/privkey.pem;

        # Redirect to the main domain to ensure same-site cookies and WebSockets
        return 301 https://al-markazia.duckdns.org$request_uri;
    }
}
